<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a1628"/><stop offset="50%" stop-color="#0f1f3d"/><stop offset="100%" stop-color="#1a3a6b"/></linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d4a843"/><stop offset="100%" stop-color="#b8912e"/></linearGradient>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a3a6b"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#d4a843" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1100" height="750" fill="url(#bgGrad)"/>
  <circle cx="1000" cy="50" r="250" fill="rgba(212,168,67,0.05)" filter="url(#s)"/>

  <!-- Dimmed background showing the app with chat open -->
  <rect width="1100" height="750" fill="rgba(0,0,0,0.4)"/>

  <!-- Chat Widget (centered) -->
  <rect x="300" y="60" rx="20" ry="20" width="500" height="630" fill="rgba(15,30,52,0.98)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#s)"/>
  
  <!-- Chat Header -->
  <rect x="300" y="60" rx="20" ry="20" width="500" height="64" fill="rgba(10,22,40,0.95)"/>
  <text x="320" y="92" fill="#d4a843" font-size="18">✨</text>
  <text x="346" y="92" fill="white" font-size="16" font-weight="600">NovaBank AI Assistant</text>
  <text x="346" y="110" fill="#22c55e" font-size="10">● Online</text>
  <rect x="740" y="72" rx="8" ry="8" width="36" height="36" fill="rgba(255,255,255,0.05)"/>
  <text x="758" y="96" fill="#8ba3c7" font-size="16" text-anchor="middle">🗑</text>
  <rect x="756" y="72" rx="8" ry="8" width="28" height="36" fill="rgba(255,255,255,0.05)"/>
  <text x="770" y="96" fill="#8ba3c7" font-size="16" text-anchor="middle">─</text>

  <!-- Chat Messages -->
  <!-- AI Welcome Message -->
  <rect x="320" y="140" rx="14" ry="14" width="320" height="100" fill="rgba(255,255,255,0.06)"/>
  <text x="336" y="164" fill="white" font-size="13" font-weight="600">👋 Hello! I'm your NovaBank AI Assistant.</text>
  <text x="336" y="186" fill="#8ba3c7" font-size="11">I can help you with:</text>
  <text x="336" y="204" fill="#8ba3c7" font-size="11">• Account Information — Check balances</text>
  <text x="336" y="220" fill="#8ba3c7" font-size="11">• Transactions — View recent activity</text>
  <text x="336" y="236" fill="#8ba3c7" font-size="11">• Financial Insights — Recommendations</text>

  <!-- User message -->
  <rect x="460" y="258" rx="14" ry="14" width="310" height="36" fill="rgba(212,168,67,0.15)" stroke="rgba(212,168,67,0.2)" stroke-width="1"/>
  <text x="478" y="282" fill="#d4a843" font-size="13">What's my current account balance?</text>

  <!-- AI Response -->
  <rect x="320" y="310" rx="14" ry="14" width="350" height="72" fill="rgba(255,255,255,0.06)"/>
  <text x="336" y="334" fill="white" font-size="13" font-weight="600">🤖 Account Balance Summary</text>
  <text x="336" y="354" fill="#8ba3c7" font-size="11">Your total account balance is $247,890.32</text>
  <text x="336" y="370" fill="#8ba3c7" font-size="11">Primary Checking: $45,230.89</text>

  <!-- User message 2 -->
  <rect x="460" y="398" rx="14" ry="14" width="310" height="36" fill="rgba(212,168,67,0.15)" stroke="rgba(212,168,67,0.2)" stroke-width="1"/>
  <text x="478" y="422" fill="#d4a843" font-size="13">Show my recent transactions</text>

  <!-- AI Response 2 -->
  <rect x="320" y="450" rx="14" ry="14" width="350" height="88" fill="rgba(255,255,255,0.06)"/>
  <text x="336" y="474" fill="white" font-size="13" font-weight="600">📋 Recent Transactions</text>
  <text x="336" y="494" fill="#8ba3c7" font-size="11">• Salary Deposit +$8,450.00 (Today)</text>
  <text x="336" y="510" fill="#8ba3c7" font-size="11">• Amazon -$234.99 (Yesterday)</text>
  <text x="336" y="526" fill="#8ba3c7" font-size="11">• Electric Bill -$145.50 (2 days ago)</text>

  <!-- Suggestion Chips -->
  <rect x="320" y="556" rx="16" ry="16" width="130" height="32" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="360" y="577" fill="#8ba3c7" font-size="11" text-anchor="middle">💰 Account Balance</text>
  <rect x="458" y="556" rx="16" ry="16" width="120" height="32" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="493" y="577" fill="#8ba3c7" font-size="11" text-anchor="middle">📈 Investment</text>
  <rect x="586" y="556" rx="16" ry="16" width="100" height="32" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="616" y="577" fill="#8ba3c7" font-size="11" text-anchor="middle">🏦 Loans</text>

  <!-- Chat Input -->
  <rect x="316" y="608" rx="12" ry="12" width="468" height="48" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="336" y="636" fill="#5a7298" font-size="12">Ask anything about your banking...</text>
  <rect x="730" y="614" rx="10" ry="10" width="38" height="36" fill="url(#goldGrad)"/>
  <text x="749" y="638" fill="#0a1628" font-size="16" text-anchor="middle" font-weight="700">➤</text>

  <!-- Floating Chat Button (visible when chat is closed) -->
  <!-- Not shown because chat is open -->
</svg>
