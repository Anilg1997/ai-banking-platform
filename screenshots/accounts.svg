  <text x="770" y="462" fill="#5a7298" font-size="11">Matures: Dec 15, 2026 | 7.2% p.a.</text>
  <rect x="960" y="368" rx="6" ry="6" width="80" height="20" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
