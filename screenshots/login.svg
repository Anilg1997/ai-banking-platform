<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1100" height="750" fill="url(#bgGrad)"/>
  <!-- Grid overlay -->
  <rect width="1100" height="750" fill="url(#bgGrad)" opacity="0.5"/>
  <line x1="0" y1="60" x2="1100" y2="60" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="120" x2="1100" y2="120" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="180" x2="1100" y2="180" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="240" x2="1100" y2="240" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="300" x2="1100" y2="300" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="360" x2="1100" y2="360" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1100" y2="420" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="480" x2="1100" y2="480" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="540" x2="1100" y2="540" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="600" x2="1100" y2="600" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="0" y1="660" x2="1100" y2="660" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="750" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="750" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="180" y1="0" x2="180" y2="750" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="750" stroke="rgba(212,168,67,0.03)" stroke-width="1"/>

  <!-- Animated orbs -->
  <circle cx="900" cy="100" r="250" fill="rgba(212,168,67,0.06)" filter="url(#cardShadow)"/>
  <circle cx="200" cy="600" r="200" fill="rgba(59,130,246,0.04)" filter="url(#cardShadow)"/>

  <!-- Auth Card -->
  <rect x="350" y="80" rx="20" ry="20" width="400" height="600" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#cardShadow)"/>
  
  <!-- Brand -->
  <text x="550" y="140" fill="#d4a843" font-size="28" text-anchor="middle">◆</text>
  <text x="550" y="174" fill="white" font-size="24" font-weight="700" text-anchor="middle">Nova<span fill="#d4a843" font-weight="700">Bank</span></text>
  <text x="550" y="198" fill="#8ba3c7" font-size="13" text-anchor="middle">Welcome back! Sign in to your account</text>

  <!-- Email field -->
  <rect x="380" y="226" rx="12" ry="12" width="340" height="56" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="396" y="248" fill="#8ba3c7" font-size="10" font-weight="500">Username or Email</text>
  <text x="396" y="268" fill="white" font-size="14">anil@novabank.com</text>

  <!-- Password field -->
  <rect x="380" y="296" rx="12" ry="12" width="340" height="56" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="396" y="318" fill="#8ba3c7" font-size="10" font-weight="500">Password</text>
  <text x="396" y="338" fill="white" font-size="14">••••••••</text>
  <rect x="690" y="314" rx="4" ry="4" width="16" height="16" fill="none" stroke="#5a7298" stroke-width="1"/>
  <text x="695" y="327" fill="#5a7298" font-size="10">👁</text>

  <!-- Remember Me -->
  <rect x="380" y="366" rx="3" ry="3" width="16" height="16" fill="rgba(212,168,67,0.2)" stroke="#d4a843" stroke-width="1"/>
  <text x="388" y="378" fill="#d4a843" font-size="11">✓</text>
  <text x="404" y="378" fill="#8ba3c7" font-size="12">Remember me</text>

  <!-- Sign In button -->
  <rect x="380" y="400" rx="12" ry="12" width="340" height="52" fill="url(#goldGrad)"/>
  <text x="550" y="433" fill="#0a1628" font-size="15" font-weight="700" text-anchor="middle">Sign In</text>

  <!-- Divider -->
  <text x="550" y="478" fill="#5a7298" font-size="12" text-anchor="middle">─────────────────  or continue with  ─────────────────</text>

  <!-- Google SSO -->
  <rect x="380" y="496" rx="12" ry="12" width="160" height="48" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="460" y="526" fill="#8ba3c7" font-size="13" text-anchor="middle">🔵 Google</text>
  
  <rect x="560" y="496" rx="12" ry="12" width="160" height="48" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="640" y="526" fill="#8ba3c7" font-size="13" text-anchor="middle">⚫ GitHub</text>

  <!-- Register link -->
  <text x="550" y="568" fill="#8ba3c7" font-size="13" text-anchor="middle">Don't have an account?</text>
  <text x="550" y="592" fill="#d4a843" font-size="14" font-weight="600" text-anchor="middle" text-decoration="underline">Create Account</text>
</svg>
